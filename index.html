<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PushPic - 打开即用的 GitHub Pages 图床，图片直接上传到部署仓库" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico?v=3a17c9d1" />
  <link rel="apple-touch-icon" href="./assets/img/logo-180.png?v=2f5c81a4" />
  <title>PushPic · 开箱即用图床</title>
  <link rel="stylesheet" href="./assets/style.css?v=c41e8a72" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="./assets/img/logo-180.png?v=2f5c81a4" alt="PushPic logo" />
      <div>
        <h1>PushPic</h1>
        <p>Simple image hosting powered by GitHub Pages</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="pagesBadge" class="badge">图片库</span>
      <span id="repoBadge" class="badge badge-ok">TechnologySauce/PushPic</span>
    </div>
  </header>

  <main class="container">
    <section class="card upload-card">
      <div class="card-head">
        <h2>上传图片</h2>
        <span class="hint">支持 30+ 种格式 · 拖拽上传 · 最多 20 张 · 单张 ≤ 50 MB</span>
      </div>
      <div class="convert-bar">
        <label for="formatSelect">上传时自动转换为</label>
        <select id="formatSelect" class="select">
          <option value="keep" selected>保持原格式</option>
          <option value="webp">WebP（推荐，体积更小）</option>
          <option value="avif">AVIF（更高压缩率）</option>
          <option value="svg">SVG（矢量轮廓，适合简单图形）</option>
        </select>
        <span id="formatHint" class="convert-hint">设置自动保存在本机浏览器，下次打开仍生效</span>
      </div>
      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖拽图片上传">
        <div class="dropzone-icon">＋</div>
        <p class="dropzone-title">拖拽图片到这里，或点击选择文件</p>
        <p class="dropzone-sub">图片会转换后直接上传到本仓库的 <code>images/</code> 目录，无需配置</p>
        <input id="fileInput" type="file" accept=".bmp,.jpg,.jpeg,.png,.tif,.tiff,.gif,.pcx,.tga,.exif,.fpx,.svg,.svgz,.psd,.cdr,.pcd,.dxf,.ufo,.eps,.ai,.raw,.cr2,.cr3,.nef,.arw,.dng,.wmf,.emf,.webp,.avif,.apng,.heic,.heif,.ico,image/*" multiple hidden />
      </div>
      <div id="progressWrap" class="progress-wrap" hidden>
        <div class="progress-bar"><div id="progressBar" class="progress-fill"></div></div>
        <span id="progressText" class="progress-text"></span>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>图片库</h2>
        <div class="gallery-actions">
          <div class="search-wrap">
            <input id="searchInput" class="input search" type="search" placeholder="搜索文件名（空格分隔多关键词）…" aria-label="搜索文件名" />
            <button id="searchClear" class="search-clear" type="button" aria-label="清空搜索" hidden>×</button>
          </div>
          <button id="refreshBtn" class="btn btn-ghost btn-refresh" type="button" aria-label="刷新图片库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="refresh-track" cx="12" cy="12" r="9"/><circle class="refresh-arc" cx="12" cy="12" r="9"/></svg>
            <span class="refresh-text"><span class="refresh-label">刷新</span><small class="refresh-sub">点击同步</small></span>
          </button>
        </div>
      </div>
      <div class="gallery-toolbar">
        <span id="resultCount" class="result-count">共 0 张</span>
        <span id="refreshMeta" class="refresh-meta">尚未刷新</span>
      </div>
      <div id="gallery" class="gallery">
        <p class="empty">正在加载图片库…</p>
      </div>
      <div class="pagination" hidden id="pagination">
        <button id="prevBtn" class="btn btn-ghost" type="button">上一页</button>
        <span id="pageInfo"></span>
        <button id="nextBtn" class="btn btn-ghost" type="button">下一页</button>
      </div>
    </section>
  </main>

  <div id="previewModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-preview="1"></div>
    <div class="modal-panel preview-panel" role="dialog" aria-modal="true" aria-label="图片预览">
      <div class="modal-head">
        <h2 id="previewName"></h2>
        <button class="icon-btn" type="button" data-close-preview="1" aria-label="关闭">×</button>
      </div>
      <div class="preview-body"><img id="previewImg" alt="预览" /></div>
      <div class="preview-tip">← / → 切换图片，Esc 关闭</div>
      <div class="preview-links" id="previewLinks"></div>
    </div>
  </div>

  <script src="./assets/app.js?v=f83b19c2"></script>
</body>
</html>
